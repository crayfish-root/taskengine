name: Add persistent volume to Postgres

# One-off: the Postgres service created by migrate-to-postgres.yml has no
# volume mount, so its data lives only in the container's writable layer —
# not durable across a Swarm reschedule (image update, node restart, etc).
# This adds a named-volume mount at /var/lib/postgresql/data and redeploys
# both the Postgres service and the app (the app redeploy re-seeds into the
# now-empty, now-persistent volume — the previously seeded data was in the
# unmounted layer and is expected to be discarded here).
on:
  workflow_dispatch:
    inputs:
      dokploy_url:
        description: "Dokploy dashboard base URL"
        required: true
      dokploy_token:
        description: "Dokploy API token"
        required: true

jobs:
  add-volume:
    runs-on: ubuntu-latest
    steps:
      - name: Mask token
        uses: actions/github-script@v7
        env:
          DOKPLOY_TOKEN: ${{ inputs.dokploy_token }}
        with:
          script: core.setSecret(process.env.DOKPLOY_TOKEN)

      - name: Add volume and redeploy
        env:
          DOKPLOY_TOKEN: ${{ inputs.dokploy_token }}
          DOKPLOY_URL_RAW: ${{ inputs.dokploy_url }}
        run: |
          set -euo pipefail
          BASE="$DOKPLOY_URL_RAW"
          if [[ "$BASE" != http://* && "$BASE" != https://* ]]; then
            BASE="https://$BASE"
          fi
          BASE="${BASE%/}"
          API="$BASE/api"

          call() {
            local method="$1" path="$2" body="${3:-}"
            if [ -n "$body" ]; then
              curl -sS -X "$method" "$API/$path" -H "x-api-key: $DOKPLOY_TOKEN" -H "Content-Type: application/json" -d "$body"
            else
              curl -sS -X "$method" "$API/$path" -H "x-api-key: $DOKPLOY_TOKEN"
            fi
          }
          check_err() {
            local label="$1" resp="$2"
            if echo "$resp" | jq -e 'type == "object" and has("code")' >/dev/null 2>&1; then
              echo "$label failed: $resp"; exit 1
            fi
          }

          echo "== Finding the taskengine project's Postgres service =="
          ALL=$(call GET project.all)
          PROJECT=$(echo "$ALL" | jq -c '[.[] | select(.name=="taskengine")] | sort_by(.createdAt) | last')
          if [ "$PROJECT" = "null" ]; then echo "No taskengine project found"; exit 1; fi
          APPLICATION_ID=$(echo "$PROJECT" | jq -r '.environments[0].applications[0].applicationId')
          POSTGRES_ID=$(echo "$PROJECT" | jq -r '.environments[0].postgres[0].postgresId // empty')
          if [ -z "$POSTGRES_ID" ]; then echo "No Postgres service found on this project"; exit 1; fi
          echo "postgresId=$POSTGRES_ID applicationId=$APPLICATION_ID"

          echo "== Checking for an existing mount =="
          EXISTING=$(call GET "mounts.listByServiceId?serviceId=$POSTGRES_ID&serviceType=postgres")
          HAS_MOUNT=$(echo "$EXISTING" | jq -r 'if type=="array" then (length>0) else false end')
          if [ "$HAS_MOUNT" = "true" ]; then
            echo "A mount already exists, skipping creation: $EXISTING"
          else
            echo "== Creating volume mount =="
            MOUNT_JSON=$(jq -n --arg id "$POSTGRES_ID" \
              '{type:"volume", volumeName:"taskengine-db-data", mountPath:"/var/lib/postgresql/data", serviceType:"postgres", serviceId:$id}')
            check_err "mounts.create" "$(call POST mounts.create "$MOUNT_JSON")"
          fi

          echo "== Redeploying Postgres to apply the mount =="
          check_err "postgres.deploy" "$(call POST postgres.deploy "$(jq -n --arg id "$POSTGRES_ID" '{postgresId:$id}')")"

          echo "== Waiting for Postgres to be running =="
          for i in $(seq 1 30); do
            PG_INFO=$(call GET "postgres.one?postgresId=$POSTGRES_ID")
            STATUS=$(echo "$PG_INFO" | jq -r '.applicationStatus // empty')
            echo "postgres status: ${STATUS:-<none yet>}"
            if [ "$STATUS" = "running" ] || [ "$STATUS" = "done" ]; then break; fi
            if [ "$STATUS" = "error" ]; then echo "Postgres failed to start"; exit 1; fi
            sleep 5
          done

          echo "== Redeploying the application (re-seed into the persistent volume) =="
          check_err "application.deploy" "$(call POST application.deploy "$(jq -n --arg id "$APPLICATION_ID" '{applicationId:$id, title:"Redeploy after adding Postgres volume"}')")"

          echo "== Waiting for app deployment to finish =="
          for i in $(seq 1 60); do
            DEPLOYS=$(call GET "deployment.allByType?id=$APPLICATION_ID&type=application")
            LATEST=$(echo "$DEPLOYS" | jq -c 'if type=="array" then . else (.deployments // .data // []) end | sort_by(.createdAt) | last // {}')
            STATUS=$(echo "$LATEST" | jq -r '.status // empty')
            echo "deployment status: ${STATUS:-<none yet>}"
            if [ "$STATUS" = "done" ]; then break; fi
            if [ "$STATUS" = "error" ] || [ "$STATUS" = "cancelled" ]; then
              DID=$(echo "$LATEST" | jq -r '.deploymentId // empty')
              echo "Deployment failed with status: $STATUS"
              if [ -n "$DID" ]; then call GET "deployment.readLogs?deploymentId=$DID&tail=300" | jq -r 'if type=="string" then . else tostring end'; fi
              exit 1
            fi
            sleep 10
          done

          DOMAINS=$(call GET "domain.byApplicationId?applicationId=$APPLICATION_ID")
          HOST=$(echo "$DOMAINS" | jq -r '.[0].host // empty')
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
        id: run

      - name: Smoke test
        env:
          HOST: ${{ steps.run.outputs.host }}
        run: |
          set -e
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 8 "https://$HOST/login" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "App is live: https://$HOST/login (HTTP $CODE)"
              exit 0
            fi
            echo "waiting... last code $CODE"
            sleep 10
          done
          echo "App did not respond 200 in time"; exit 1
