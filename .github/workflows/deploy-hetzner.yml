name: Deploy to Hetzner (Helsinki)

# One-off manual deploy: provisions a fresh Hetzner Cloud server in Helsinki,
# copies the app to it, and starts it as a systemd service on port 80.
# The API token is supplied per-run as a workflow_dispatch input — never
# stored as a secret, never committed anywhere.
on:
  workflow_dispatch:
    inputs:
      hetzner_token:
        description: "Hetzner Cloud API token (Read & Write)"
        required: true
      server_type:
        description: "Hetzner server type"
        required: false
        default: "cx22"
      location:
        description: "Hetzner location"
        required: false
        default: "hel1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Uses core.setSecret() rather than `run: echo "::add-mask::${{ inputs.x }}"` —
      # the latter interpolates the raw value into the logged command text itself
      # (the "Run echo ..." line) before masking ever takes effect, leaking it
      # regardless of the mask. actions/github-script's `script:` never contains
      # the raw value as literal text, so nothing gets echoed.
      - name: Mask token
        uses: actions/github-script@v7
        env:
          HETZNER_TOKEN: ${{ inputs.hetzner_token }}
        with:
          script: core.setSecret(process.env.HETZNER_TOKEN)

      - name: Generate deploy keypair
        run: ssh-keygen -t ed25519 -N "" -f deploy_key -q

      - name: Provision server
        id: provision
        env:
          HETZNER_TOKEN: ${{ inputs.hetzner_token }}
          SERVER_TYPE: ${{ inputs.server_type }}
          LOCATION: ${{ inputs.location }}
        run: |
          set -euo pipefail
          API=https://api.hetzner.cloud/v1
          AUTH="Authorization: Bearer ${HETZNER_TOKEN}"

          KEY_NAME="taskengine-deploy-${{ github.run_id }}"
          KEY_JSON=$(jq -n --arg name "$KEY_NAME" --arg key "$(cat deploy_key.pub)" '{name:$name, public_key:$key}')
          KEY_RESP=$(curl -sS -X POST "$API/ssh_keys" -H "$AUTH" -H "Content-Type: application/json" -d "$KEY_JSON")
          KEY_ID=$(echo "$KEY_RESP" | jq -r '.ssh_key.id // empty')
          if [ -z "$KEY_ID" ]; then echo "Failed to upload SSH key: $KEY_RESP"; exit 1; fi

          SERVER_JSON=$(jq -n --arg name "taskengine-${{ github.run_id }}" --arg type "$SERVER_TYPE" \
            --arg loc "$LOCATION" --argjson keyid "$KEY_ID" \
            '{name:$name, server_type:$type, image:"ubuntu-24.04", location:$loc, ssh_keys:[$keyid]}')
          SERVER_RESP=$(curl -sS -X POST "$API/servers" -H "$AUTH" -H "Content-Type: application/json" -d "$SERVER_JSON")
          SERVER_IP=$(echo "$SERVER_RESP" | jq -r '.server.public_net.ipv4.ip // empty')
          SERVER_ID=$(echo "$SERVER_RESP" | jq -r '.server.id // empty')
          if [ -z "$SERVER_IP" ] || [ "$SERVER_IP" = "null" ]; then echo "Failed to create server: $SERVER_RESP"; exit 1; fi

          echo "server_ip=$SERVER_IP" >> "$GITHUB_OUTPUT"
          echo "server_id=$SERVER_ID" >> "$GITHUB_OUTPUT"
          echo "### Provisioned server" >> "$GITHUB_STEP_SUMMARY"
          echo "- IP: \`$SERVER_IP\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Type: $SERVER_TYPE, Location: $LOCATION" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for SSH
        run: |
          set -e
          for i in $(seq 1 60); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i deploy_key root@${{ steps.provision.outputs.server_ip }} echo ready 2>/dev/null; then
              echo "SSH is up"; exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for SSH"; exit 1

      - name: Copy app to server
        run: |
          rsync -az --exclude node_modules --exclude .git --exclude .next --exclude '*.db' \
            -e "ssh -o StrictHostKeyChecking=no -i deploy_key" \
            ./ root@${{ steps.provision.outputs.server_ip }}:/opt/taskengine/

      - name: Install, seed, build, and start
        run: |
          SESSION_SECRET=$(openssl rand -hex 32)
          ssh -o StrictHostKeyChecking=no -i deploy_key root@${{ steps.provision.outputs.server_ip }} \
            bash /opt/taskengine/deploy/remote-setup.sh "$SESSION_SECRET"

      - name: Smoke test
        run: |
          set -e
          IP=${{ steps.provision.outputs.server_ip }}
          for i in $(seq 1 20); do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 5 "http://$IP/login" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "App is live: http://$IP/login (HTTP $CODE)"
              echo "## App is live" >> "$GITHUB_STEP_SUMMARY"
              echo "[http://$IP/login](http://$IP/login)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "App did not come up in time (last code: $CODE)"; exit 1
