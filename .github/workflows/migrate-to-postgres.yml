name: Migrate deployed app to Postgres

# One-off: creates a Postgres service in the existing "taskengine" Dokploy
# project/environment (if one doesn't already exist), points the existing
# application's DATABASE_URL at it, and redeploys — on the SAME
# project/application, not a new one. Token is a workflow_dispatch input,
# masked via core.setSecret(), never stored as a repo secret.
on:
  workflow_dispatch:
    inputs:
      dokploy_url:
        description: "Dokploy dashboard base URL"
        required: true
      dokploy_token:
        description: "Dokploy API token"
        required: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Mask token
        uses: actions/github-script@v7
        env:
          DOKPLOY_TOKEN: ${{ inputs.dokploy_token }}
        with:
          script: core.setSecret(process.env.DOKPLOY_TOKEN)

      - name: Provision Postgres and point the app at it
        env:
          DOKPLOY_TOKEN: ${{ inputs.dokploy_token }}
          DOKPLOY_URL_RAW: ${{ inputs.dokploy_url }}
        run: |
          set -euo pipefail
          BASE="$DOKPLOY_URL_RAW"
          if [[ "$BASE" != http://* && "$BASE" != https://* ]]; then
            BASE="https://$BASE"
          fi
          BASE="${BASE%/}"
          API="$BASE/api"

          call() {
            local method="$1" path="$2" body="${3:-}"
            if [ -n "$body" ]; then
              curl -sS -X "$method" "$API/$path" -H "x-api-key: $DOKPLOY_TOKEN" -H "Content-Type: application/json" -d "$body"
            else
              curl -sS -X "$method" "$API/$path" -H "x-api-key: $DOKPLOY_TOKEN"
            fi
          }
          check_err() {
            local label="$1" resp="$2"
            if echo "$resp" | jq -e 'type == "object" and has("code")' >/dev/null 2>&1; then
              echo "$label failed: $resp"; exit 1
            fi
          }

          echo "== Finding the existing taskengine project =="
          ALL=$(call GET project.all)
          PROJECT=$(echo "$ALL" | jq -c '[.[] | select(.name=="taskengine")] | sort_by(.createdAt) | last')
          if [ "$PROJECT" = "null" ]; then echo "No taskengine project found"; exit 1; fi
          ENVIRONMENT_ID=$(echo "$PROJECT" | jq -r '.environments[0].environmentId')
          APPLICATION_ID=$(echo "$PROJECT" | jq -r '.environments[0].applications[0].applicationId')
          EXISTING_PG=$(echo "$PROJECT" | jq -c '.environments[0].postgres[0] // empty')
          echo "environmentId=$ENVIRONMENT_ID applicationId=$APPLICATION_ID"

          if [ -n "$EXISTING_PG" ]; then
            POSTGRES_ID=$(echo "$EXISTING_PG" | jq -r '.postgresId')
            echo "== Reusing existing Postgres service $POSTGRES_ID =="
            PG_INFO=$(call GET "postgres.one?postgresId=$POSTGRES_ID")
          else
            echo "== Creating Postgres service =="
            DB_PASSWORD=$(openssl rand -hex 16)
            PG_JSON=$(jq -n --arg envId "$ENVIRONMENT_ID" --arg pw "$DB_PASSWORD" \
              '{name:"taskengine-db", appName:"taskengine-db", databaseName:"taskengine", databaseUser:"taskengine", databasePassword:$pw, environmentId:$envId}')
            PG_RESP=$(call POST postgres.create "$PG_JSON")
            check_err "postgres.create" "$PG_RESP"
            POSTGRES_ID=$(echo "$PG_RESP" | jq -r '.postgresId // empty')
            if [ -z "$POSTGRES_ID" ]; then echo "postgres.create: no postgresId in response: $PG_RESP"; exit 1; fi

            echo "== Deploying Postgres service =="
            check_err "postgres.deploy" "$(call POST postgres.deploy "$(jq -n --arg id "$POSTGRES_ID" '{postgresId:$id}')")"

            echo "== Waiting for Postgres to be running =="
            for i in $(seq 1 30); do
              PG_INFO=$(call GET "postgres.one?postgresId=$POSTGRES_ID")
              STATUS=$(echo "$PG_INFO" | jq -r '.applicationStatus // empty')
              echo "postgres status: ${STATUS:-<none yet>}"
              if [ "$STATUS" = "running" ] || [ "$STATUS" = "done" ]; then break; fi
              if [ "$STATUS" = "error" ]; then echo "Postgres failed to start"; exit 1; fi
              sleep 5
            done
          fi

          PG_APP_NAME=$(echo "$PG_INFO" | jq -r '.appName')
          PG_USER=$(echo "$PG_INFO" | jq -r '.databaseUser')
          PG_PASSWORD=$(echo "$PG_INFO" | jq -r '.databasePassword')
          PG_DBNAME=$(echo "$PG_INFO" | jq -r '.databaseName')
          if [ -z "$PG_APP_NAME" ] || [ "$PG_APP_NAME" = "null" ]; then echo "Could not read Postgres connection details: $PG_INFO"; exit 1; fi
          DATABASE_URL="postgresql://${PG_USER}:${PG_PASSWORD}@${PG_APP_NAME}:5432/${PG_DBNAME}"
          echo "internal DATABASE_URL host: $PG_APP_NAME"

          echo "== Updating application env vars =="
          SESSION_SECRET=$(openssl rand -hex 32)
          ENV_STRING=$(printf 'DATABASE_URL=%s\nSESSION_SECRET=%s\n' "$DATABASE_URL" "$SESSION_SECRET")
          ENV_JSON=$(jq -n --arg id "$APPLICATION_ID" --arg env "$ENV_STRING" \
            '{applicationId:$id, env:$env, buildArgs:null, buildSecrets:null, createEnvFile:true}')
          check_err "saveEnvironment" "$(call POST application.saveEnvironment "$ENV_JSON")"

          echo "== Redeploying application =="
          check_err "application.deploy" "$(call POST application.deploy "$(jq -n --arg id "$APPLICATION_ID" '{applicationId:$id, title:"Migrate to Postgres"}')")"

          echo "== Waiting for deployment to finish =="
          for i in $(seq 1 60); do
            DEPLOYS=$(call GET "deployment.allByType?id=$APPLICATION_ID&type=application")
            LATEST=$(echo "$DEPLOYS" | jq -c 'if type=="array" then . else (.deployments // .data // []) end | sort_by(.createdAt) | last // {}')
            STATUS=$(echo "$LATEST" | jq -r '.status // empty')
            echo "deployment status: ${STATUS:-<none yet>}"
            if [ "$STATUS" = "done" ]; then break; fi
            if [ "$STATUS" = "error" ] || [ "$STATUS" = "cancelled" ]; then
              DID=$(echo "$LATEST" | jq -r '.deploymentId // empty')
              echo "Deployment failed with status: $STATUS"
              if [ -n "$DID" ]; then call GET "deployment.readLogs?deploymentId=$DID&tail=300" | jq -r 'if type=="string" then . else tostring end'; fi
              exit 1
            fi
            sleep 10
          done

          echo "== Looking up domain =="
          DOMAINS=$(call GET "domain.byApplicationId?applicationId=$APPLICATION_ID")
          HOST=$(echo "$DOMAINS" | jq -r '.[0].host // empty')
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "### Migrated to Postgres" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: https://$HOST" >> "$GITHUB_STEP_SUMMARY"
        id: migrate

      - name: Smoke test
        env:
          HOST: ${{ steps.migrate.outputs.host }}
        run: |
          set -e
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 8 "https://$HOST/login" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "App is live: https://$HOST/login (HTTP $CODE)"
              exit 0
            fi
            echo "waiting... last code $CODE"
            sleep 10
          done
          echo "App did not respond 200 in time"; exit 1
