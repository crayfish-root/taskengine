name: Verify brand mark and app icons (read-only)

# Read-only: does NOT redeploy. Screenshots the login page and the logged-in
# desktop sidebar (both show the new brand mark), and checks that the
# favicon/app-icon/manifest endpoints actually serve content.
on:
  workflow_dispatch:
    inputs:
      app_host:
        description: "Live app hostname (no scheme)"
        required: true
      demo_email:
        description: "Demo account email to log in with"
        required: false
        default: "cio@taskengine.io"
      demo_password:
        description: "Demo account password"
        required: false
        default: "password123"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Mask password
        uses: actions/github-script@v7
        env:
          DEMO_PASSWORD: ${{ inputs.demo_password }}
        with:
          script: core.setSecret(process.env.DEMO_PASSWORD)

      - name: Set up Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.48 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Check icon endpoints and screenshot the brand mark
        env:
          HOST: ${{ inputs.app_host }}
          DEMO_EMAIL: ${{ inputs.demo_email }}
          DEMO_PASSWORD: ${{ inputs.demo_password }}
        run: |
          cat > verify.mjs <<'EOF'
          import { chromium } from "playwright";

          const host = process.env.HOST;
          const email = process.env.DEMO_EMAIL;
          const password = process.env.DEMO_PASSWORD;
          const base = `https://${host}`;
          let failures = 0;

          function check(label, ok, extra) {
            console.log(`${ok ? "OK  " : "FAIL"} ${label}${extra ? " -> " + extra : ""}`);
            if (!ok) failures++;
          }

          const browser = await chromium.launch();
          const context = await browser.newContext({ viewport: { width: 1440, height: 900 } });
          const page = await context.newPage();

          for (const path of ["/favicon.ico", "/icon.svg", "/apple-icon.png", "/manifest.webmanifest"]) {
            const resp = await page.goto(`${base}${path}`, { waitUntil: "load" });
            check(`GET ${path}`, !!resp && resp.status() === 200, String(resp?.status()));
          }

          await page.goto(`${base}/login`, { waitUntil: "networkidle" });
          await page.waitForTimeout(300);
          await page.screenshot({ path: "brand-login.png" });
          check("Login page screenshot captured", true);

          await page.fill('input#email', email);
          await page.fill('input#password', password);
          await page.click('button[type="submit"]');
          await page.waitForURL(/dashboard/, { timeout: 15000 });
          await page.waitForTimeout(400);
          await page.screenshot({ path: "brand-dashboard-sidebar.png" });
          check("Logged-in dashboard (sidebar) screenshot captured", true);

          await browser.close();

          console.log(`\n\nTOTAL FAILURES: ${failures}`);
          if (failures > 0) process.exit(1);
          console.log("BRAND MARK VERIFIED");
          EOF
          node verify.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brand-mark-screenshots
          path: "*.png"
          retention-days: 7
          if-no-files-found: ignore
